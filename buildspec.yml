version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 22
    commands:
      - npm install -g aws-cdk
  pre_build:
    commands:
      - echo Starting Docker daemon...
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2 &
      - timeout 15 sh -c "until docker info; do echo waiting for docker; sleep 1; done"
  build:
    commands:
      - echo Compiling Java Code...
      - mvn clean compile
      - echo Deploying Infrastructure...
      # We inject flags to turn off Flyway and database initialization for the CDK runtime execution
      - cdk deploy --app "mvn exec:java -Dexec.mainClass=com.aiinfluencer.AiInfluencerAgentApplication -Dspring.flyway.enabled=false -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaConfiguration" --require-approval never
