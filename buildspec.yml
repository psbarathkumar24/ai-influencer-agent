version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 22
    commands:
      - echo Installing AWS CDK CLI globally...
      - npm install -g aws-cdk
  pre_build:
    commands:
      - echo Starting Docker daemon...
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2 &
      - timeout 15 sh -c "until docker info; do echo waiting for docker; sleep 1; done"
      - echo Compiling parent Spring Boot project...
      - mvn clean package -DskipTests
      - echo Pre-building Docker Container to break the recursive path loop...
      - docker build -t ai-influencer-backend:latest .
  build:
    commands:
      - echo Removing local workspace caching to maintain a clean workspace...
      - rm -rf infrastructure/cdk/cdk.out infrastructure/cdk/.cdk.staging
      - echo Navigating to the infrastructure directory...
      - cd infrastructure/cdk
      - echo Installing CDK dependencies...
      - npm install
      - echo Deploying fresh infrastructure via CDK...
      - cdk deploy --require-approval never
